<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Processing Profile - LinkAssist</title>
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background-color: #000;
      color: #fff;
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    
    .container {
      width: 100%;
      padding: 24px 20px;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    
    .logo {
      font-size: 28px;
      font-weight: 500;
      margin-bottom: 40px;
    }
    
    .logo span {
      color: #4e83d4;
    }
    
    .loading-container {
      background-color: #1a1a1a;
      border-radius: 12px;
      padding: 30px;
      width: 100%;
      max-width: 400px;
      text-align: center;
    }
    
    .loading-spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top-color: #4e83d4;
      animation: spin 1s linear infinite;
      margin: 0 auto 20px;
    }
    
    .loading-text {
      font-size: 18px;
      margin-bottom: 10px;
      color: #fff;
    }
    
    .loading-subtext {
      font-size: 14px;
      color: rgba(255, 255, 255, 0.6);
      margin-bottom: 20px;
    }
    
    .error-message {
      color: #F44336;
      background-color: rgba(244, 67, 54, 0.1);
      padding: 12px;
      border-radius: 8px;
      margin-top: 20px;
      display: none;
    }

    .back-button {
      display: inline-block;
      background-color: transparent;
      border: 1px solid #4e83d4;
      color: #4e83d4;
      padding: 12px 20px;
      border-radius: 8px;
      font-size: 16px;
      margin-top: 20px;
      text-decoration: none;
      cursor: pointer;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">Link<span>Assist</span></div>
    
    <div class="loading-container">
      <div class="loading-spinner"></div>
      <div class="loading-text">Analyzing Profile</div>
      <div class="loading-subtext">This may take a few moments...</div>
      <div class="error-message" id="errorMessage"></div>
      <button class="back-button" id="backButton" style="display: none;">Try Another Profile</button>
    </div>
  </div>

  <script>
    // Check for error in URL parameters
    const urlParams = new URLSearchParams(window.location.search);
    const error = urlParams.get('error');
    const jobId = urlParams.get('jobId');
    const errorMessage = document.getElementById('errorMessage');
    const backButton = document.getElementById('backButton');

    function showError(message) {
      errorMessage.textContent = message;
      errorMessage.style.display = 'block';
      document.querySelector('.loading-spinner').style.display = 'none';
      document.querySelector('.loading-text').textContent = 'Analysis Failed';
      document.querySelector('.loading-subtext').textContent = 'Please try again';
      backButton.style.display = 'block';
    }

    if (error) {
      showError(error);
    } else if (jobId) {
      // Poll the server for job status
      const checkStatus = () => {
        fetch(`/check-status?jobId=${jobId}`)
          .then(response => response.json())
          .then(data => {
            if (data.status === 'completed') {
              window.location.href = `/results?jobId=${jobId}`;
            } else if (data.status === 'failed') {
              showError(data.error || 'Could not analyze this LinkedIn profile. Please make sure the profile is public and try again.');
            } else {
              // Continue polling
              setTimeout(checkStatus, 2000);
            }
          })
          .catch(error => {
            showError('Connection error. Please check your internet connection and try again.');
          });
      };

      checkStatus();
    } else {
      showError('No LinkedIn profile URL provided. Please go back and enter a valid LinkedIn profile URL.');
    }

    // Handle back button click
    backButton.addEventListener('click', () => {
      window.location.href = '/';
    });
  </script>
</body>
</html>
